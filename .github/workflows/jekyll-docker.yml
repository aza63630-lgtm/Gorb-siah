name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Validate static content
      run: python -m unittest discover -s tests -v
    - name: Build the site in the jekyll/builder container
      run: |
        docker run --rm \
        --user "$(id -u):$(id -g)" \
        --workdir /srv/jekyll \
        --env HOME=/tmp \
        --env BUNDLE_USER_HOME=/tmp/bundle \
        --env JEKYLL_CACHE_DIR=/tmp/jekyll-cache \
        -v "${{ github.workspace }}:/srv/jekyll" \
        --entrypoint /bin/bash \
        jekyll/builder:4.2.2 -o pipefail -c 'jekyll build --future --destination /srv/jekyll/_site'
