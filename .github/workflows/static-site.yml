name: Static site CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Validate static content
      run: python -m unittest discover -s tests -v
    - name: Build static site
      run: python scripts/build_site.py
